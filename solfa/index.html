<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solfa — Piano & Solfège</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Music&family=Poppins:wght@500;600;700;800&family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf7f1; --card:#ffffff; --ink:#23212b; --muted:#6f6a78; --line:#e9e2d8;
  --accent:#d9572b; --accent-soft:#fde9e0; --good:#2e9b63; --good-soft:#e1f4ea; --bad:#d43c3c; --bad-soft:#fbe3e3;
  --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif}
body{padding-bottom:30px}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 0}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:11px;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:'Noto Music',serif;font-size:24px}
.brand h1{font-size:19px;margin:0;font-weight:800;line-height:1.1}
.brand small{color:var(--muted);font-size:12px;font-weight:600}
.toggles{display:flex;gap:6px;flex-direction:column;align-items:flex-end}
.toggle{display:flex;background:#efe8de;border-radius:999px;padding:3px}
.toggle button{border:0;background:transparent;font:inherit;font-size:12px;font-weight:700;padding:5px 9px;border-radius:999px;color:var(--muted);cursor:pointer}
.toggle button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
nav.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#efe8de;padding:4px;border-radius:14px;margin-bottom:14px}
nav.tabs button{border:0;background:transparent;font:inherit;font-weight:800;font-size:14px;padding:10px 4px;border-radius:11px;color:var(--muted);cursor:pointer}
nav.tabs button.on{background:#fff;color:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.levels{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none;scroll-behavior:smooth}
.levels::-webkit-scrollbar{display:none}
.lvl{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 11px;font:inherit;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;cursor:pointer}
.lvl.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
h2{font-size:20px;margin:0 0 6px;font-weight:800}
.step{font-size:12px;font-weight:800;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
p{line-height:1.5;margin:8px 0;font-size:15px}
.tip{background:#fff7e0;border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px;line-height:1.45}
.btn{border:0;font:inherit;font-weight:800;font-size:15px;padding:11px 16px;border-radius:12px;cursor:pointer;background:var(--accent);color:#fff}
.btn.ghost{background:#efe8de;color:var(--ink)}
.btn.small{font-size:13px;padding:8px 12px}
.btn:disabled{opacity:.4}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:8px}
.staffbox{background:#fff;border-radius:12px;overflow-x:auto;margin:8px 0}
.staffbox svg{display:block}
.dots{display:flex;gap:5px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}

.piano{position:relative;height:150px;display:flex;user-select:none;touch-action:manipulation;margin-top:6px}
.wk{flex:1;background:#fff;border:1px solid #cfc6ba;border-top:0;border-radius:0 0 8px 8px;margin:0 1px;position:relative;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;box-shadow:inset 0 -5px 0 #eee6da;transition:background .12s;min-width:0}
.wk span{font-size:12px;font-weight:800;color:var(--muted);text-align:center;line-height:1.1}
.wk span b{display:block;font-size:9px;color:#b3aba0;font-weight:700}
.piano.dense .wk span{font-size:9px}
.piano.dense .wk span b{font-size:7px}
.piano.dense .wk{margin:0 .5px;border-radius:0 0 5px 5px}
.bk{position:absolute;top:0;height:60%;background:#2a2730;border-radius:0 0 5px 5px;cursor:pointer;z-index:2;box-shadow:inset 0 -4px 0 #000;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px}
.bk span{font-size:8px;color:#bdb6c7;font-weight:800;writing-mode:vertical-rl;transform:rotate(180deg)}
.wk.down{background:#f3ece2}
.bk.down{background:#4a4552}
.wk.good,.bk.good{background:var(--good-soft)} .wk.good span{color:var(--good)} .bk.good{background:var(--good)}
.wk.bad,.bk.bad{background:var(--bad-soft)} .wk.bad span{color:var(--bad)} .bk.bad{background:var(--bad)}
.wk.hint{background:var(--accent-soft)} .wk.hint span{color:var(--accent)} .bk.hint{background:var(--accent)}
.wk.mid::after{content:"";position:absolute;bottom:46px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.piano.dense .wk.mid::after{bottom:36px;width:5px;height:5px}
.piano.nolabels span{visibility:hidden}
.wk.lit span,.wk.lit span b{color:#fff!important}
.wk.lit.dark span,.wk.lit.dark span b{color:#5b4a00!important}
.wk.lit,.bk.lit{box-shadow:inset 0 -5px 0 rgba(0,0,0,.15);transition:background .08s}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.stat b{display:block;font-size:20px;font-weight:800}
.stat small{font-size:11px;color:var(--muted);font-weight:700}
.feedback{min-height:26px;text-align:center;font-weight:800;font-size:16px;margin:4px 0}
.feedback.good{color:var(--good)} .feedback.bad{color:var(--bad)}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1;border:1px solid var(--line);background:#fff;font:inherit;font-weight:800;font-size:13px;padding:9px 6px;border-radius:11px;cursor:pointer;color:var(--muted)}
.seg button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
label.chk{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px;margin-top:8px}
.choices.wide{grid-template-columns:1fr}
.choice{border:1.5px solid var(--line);background:#fff;font:inherit;font-weight:800;font-size:15px;padding:12px 8px;border-radius:12px;cursor:pointer;color:var(--ink)}
.choice svg{display:block;width:100%;max-height:96px}
.choice.good{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.choice.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.prompt{margin:0 0 4px;font-size:15px}
.mel{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.mel:last-child{border-bottom:0}
.mel b{font-size:15px}
.mel small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.badge{font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--good-soft);color:var(--good);white-space:nowrap}
.shake{animation:sh .3s}
@keyframes sh{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.hidden{display:none!important}
.pay{text-align:center}
.pay .duo{display:flex;justify-content:center;align-items:flex-end;gap:6px;margin:4px 0 6px}
.pay .duo img{width:86px;height:86px;border-radius:50%;object-fit:cover;border:4px solid var(--rose)}
.pay .duo svg{width:72px;height:80px}
.pay h2{font-size:24px;margin:6px 0}
.pay ul{list-style:none;padding:0;margin:12px 0;text-align:left;display:inline-block}
.pay li{margin:6px 0;font-size:15px}
.pay .price{font-family:'Baloo 2',Nunito;font-size:34px;font-weight:800;color:var(--rose);line-height:1}
.pay .price small{display:block;font-size:13px;color:var(--muted);font-family:Nunito;font-weight:700}
.pay .buy{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.pay .buy a{display:block;text-decoration:none;text-align:center}
.pay .codebox{display:flex;gap:6px;margin-top:8px}
.pay input{flex:1;min-width:0;font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:2px solid #e3d6e2;text-transform:uppercase}
.pay .msg{min-height:22px;font-weight:800;margin-top:8px}
.lvl .lock{margin-right:3px}
.kbwrap{overflow-x:auto;scroll-behavior:smooth;-webkit-overflow-scrolling:touch}
.kbinner{min-width:100%}
.teacher{display:flex;gap:10px;align-items:center;background:#fff7e0;border-radius:14px;padding:8px 10px;margin:4px 0 12px}
.owl{flex:0 0 66px;height:72px}
.owl .lowbeak{transform-box:fill-box;transform-origin:50% 0}
.owl.talking .lowbeak{animation:talk .22s infinite alternate}
@keyframes talk{to{transform:scaleY(2.2)}}
.owl .lid{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0);animation:blink 4.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(0)}97%{transform:scaleY(1)}}
.owl.talking .body{animation:bounce .5s infinite alternate}
@keyframes bounce{to{transform:translateY(-2px)}}
.tbody{flex:1;min-width:0}
.bubble{background:#fff;border-radius:12px;padding:8px 10px;font-size:14px;line-height:1.4;min-height:38px;position:relative;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.bubble::before{content:"";position:absolute;left:-7px;top:14px;border:7px solid transparent;border-right-color:#fff;border-left:0}
.tbtn{margin-top:6px}
.reading{background:#fff3c4!important;border-radius:8px;box-shadow:0 0 0 5px #fff3c4;transition:background .2s}
.sayq{border:0;background:#efe8de;border-radius:999px;font-size:14px;padding:4px 9px;margin-left:6px;cursor:pointer;vertical-align:middle}
.valtable{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.valrow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:4px 10px;font:inherit;text-align:left;cursor:pointer;color:var(--ink)}
.valrow:active{background:var(--accent-soft)}
.valicon{flex:0 0 30px}
.valtxt{flex:1;min-width:0}
.valtxt b{display:block;font-size:14px}
.valtxt small{display:block;font-size:11px;color:var(--muted);font-weight:600}
.valcnt{font-weight:800;font-size:14px;color:var(--accent);white-space:nowrap}
.valplay{font-size:11px;color:var(--muted)}
.treerow{display:flex;align-items:center;gap:6px}
.treesvg{flex:1;min-width:0}
.treesvg svg{display:block}
.melvals{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.melvals button{display:flex;align-items:center;gap:4px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:0 10px 0 4px;font:inherit;font-size:12px;font-weight:800;color:var(--ink);cursor:pointer}
.melvals button svg{width:22px;height:32px}
.melvals .hd{font-size:12px;font-weight:800;color:var(--muted);align-self:center;margin-right:2px}
.speedrow{display:flex;align-items:center;gap:8px;margin:4px 0 6px;font-size:13px;font-weight:800;color:var(--muted)}
.seg.speed{flex:1;margin:0}
.seg.speed button{padding:7px 4px;font-size:12px}
.hands{position:relative;height:74px;margin-top:4px;pointer-events:none}
.hands.off{display:none}
.palm{position:absolute;bottom:0;height:24px;border-radius:6px 6px 16px 16px;border:1.5px solid;z-index:1}
.fing{position:absolute;border-radius:11px 11px 4px 4px;border:1.5px solid;display:flex;align-items:flex-start;justify-content:center;padding-top:4px;font-size:12px;font-weight:800;transition:transform .12s, background .12s;z-index:2}
.hR .palm,.hR .fing{background:#ffe3d3;border-color:#f0a47f;color:#b4532a}
.hL .palm,.hL .fing{background:#dce8ff;border-color:#8aa8e6;color:#3557a8}
.hR .fing.on{background:#d9572b;color:#fff;border-color:#d9572b;transform:translateY(-7px)}
.hL .fing.on{background:#3a5bd9;color:#fff;border-color:#3a5bd9;transform:translateY(-7px)}
.rain{position:relative;height:150px;margin-top:8px;overflow:hidden;border-radius:12px 12px 0 0;background:linear-gradient(#ffffff,#f6efe6)}
.rain.off{display:none}
.lane{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:rgba(217,87,43,.12)}
.ball{position:absolute;top:-34px;width:28px;height:28px;margin-left:-14px;border-radius:50%;display:grid;place-items:center;font-size:9px;font-weight:800;color:#fff;box-shadow:inset -3px -4px 0 rgba(0,0,0,.18),0 2px 4px rgba(0,0,0,.18);z-index:2}
.ball.fall{animation:drop var(--dur) forwards}
@keyframes drop{0%{top:-34px;animation-timing-function:cubic-bezier(.55,0,1,.45)}82%{top:calc(100% - 30px);animation-timing-function:ease-out}91%{top:calc(100% - 42px);animation-timing-function:ease-in}100%{top:calc(100% - 30px)}}
.ball.wait{top:calc(100% - 30px);animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.ball.ghost{opacity:.33}
.ball.pop{top:calc(100% - 30px);animation:pop .35s forwards}
@keyframes pop{to{transform:scale(1.9);opacity:0}}
.ball.shake{animation:sh .3s}
.hR .fing.next{box-shadow:0 0 0 3px #ffb08a}
.hL .fing.next{box-shadow:0 0 0 3px #9fb6f2}
.handcap{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;font-weight:800;margin-top:6px}
.handcap span{padding:3px 8px;border-radius:999px}
.handcap .cR{background:#ffe3d3;color:#b4532a}.handcap .cL{background:#dce8ff;color:#3557a8}
.grp{font-size:13px;font-weight:800;color:var(--accent);margin:14px 0 2px;text-transform:uppercase;letter-spacing:.04em}
.grp:first-child{margin-top:4px}
.emo{font-size:26px;width:40px;height:40px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;flex:0 0 auto}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confetti span{position:absolute;top:-40px;animation:fall 2.2s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.lvlhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.lvlnum{width:34px;height:34px;border-radius:10px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;flex:0 0 auto}
.lvlhead b{font-size:16px;display:block}
.lvlhead small{color:var(--muted);font-size:12px;font-weight:600}

/* ===== bright children's theme ===== */
:root{ --red:#ff4d5e; --rose:#ff5fa2; --sky:#38b6ff; --sun:#ffc531; --leaf:#38c976; --grape:#9b5de5; --orange:#ff8a3d;
  --accent:#ff5fa2; --accent-soft:#ffe3f0; --lv:#38b6ff; --line:#f1e4ee; }
html,body{background:linear-gradient(180deg,#cdeeff 0%,#eaf7ff 22%,#fff3fa 60%,#fff8e6 100%) fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.55;
  background-image:radial-gradient(circle at 8% 12%,#ffd23f 0 5px,transparent 6px),radial-gradient(circle at 92% 18%,#ff5fa2 0 6px,transparent 7px),radial-gradient(circle at 85% 70%,#38b6ff 0 5px,transparent 6px),radial-gradient(circle at 12% 80%,#38c976 0 6px,transparent 7px),radial-gradient(circle at 50% 95%,#9b5de5 0 4px,transparent 5px)}
.brand h1,h2,.lvlhead b{font-family:'Baloo 2',Nunito,sans-serif}
.brand h1{font-size:24px;letter-spacing:.5px}
.brand h1 span:nth-child(1){color:var(--red)}.brand h1 span:nth-child(2){color:var(--orange)}.brand h1 span:nth-child(3){color:var(--sun)}.brand h1 span:nth-child(4){color:var(--leaf)}.brand h1 span:nth-child(5){color:var(--sky)}
.logo{background:linear-gradient(135deg,var(--rose),var(--orange));box-shadow:0 3px 0 #d63c7e}
.toggle{background:#fff;box-shadow:0 1px 0 #f1e4ee}
.toggle button.on{background:var(--sky);color:#fff}
nav.tabs{background:#fff;box-shadow:0 2px 0 #f1e4ee}
nav.tabs button[data-t=learn].on{background:var(--sky);color:#fff}
nav.tabs button[data-t=practice].on{background:var(--rose);color:#fff}
nav.tabs button[data-t=melodies].on{background:var(--sun);color:#5a3d00}
.card{border:0;border-top:5px solid var(--lv);border-radius:20px;box-shadow:0 4px 14px rgba(56,100,160,.10)}
.lvl{border:0;box-shadow:0 2px 0 rgba(0,0,0,.06);color:#fff;font-weight:800;background:var(--c);opacity:.55}
.lvl.on{opacity:1;color:#fff;background:var(--c);transform:translateY(-1px);box-shadow:0 3px 0 rgba(0,0,0,.15)}
.lvlnum{background:var(--lv);box-shadow:0 3px 0 rgba(0,0,0,.15);border-radius:12px}
.btn{background:linear-gradient(135deg,var(--rose),var(--red));box-shadow:0 3px 0 #c9365f}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #c9365f}
.btn.ghost{background:#e6f5ff;color:#16507a;box-shadow:0 3px 0 #bfe3fb}
.step{color:var(--lv)}
.tip{background:#fff6d6;border-left:5px solid var(--sun)}
.stat{border:0;box-shadow:0 2px 0 #f1e4ee}
.stat:nth-child(1) b{color:var(--leaf)}.stat:nth-child(2) b{color:var(--rose)}.stat:nth-child(3) b{color:var(--grape)}
.seg button{border:0;box-shadow:0 2px 0 #f1e4ee}
.seg button.on{background:var(--sky);color:#fff;border:0}
.choice{border:0;box-shadow:0 3px 0 #e9dbe7}
.choices .choice:nth-child(6n+1){background:#ffe6e9}.choices .choice:nth-child(6n+2){background:#fff0d9}.choices .choice:nth-child(6n+3){background:#fff8d1}
.choices .choice:nth-child(6n+4){background:#e3f8ec}.choices .choice:nth-child(6n+5){background:#e2f3ff}.choices .choice:nth-child(6n+6){background:#f0e6ff}
.choice.good{background:var(--leaf)!important;color:#fff}.choice.bad{background:var(--red)!important;color:#fff}
.grp{color:var(--rose)}
.emo{background:linear-gradient(135deg,#ffe3f0,#e2f3ff)}
.teacher{background:linear-gradient(120deg,#e2f3ff,#ffe3f0)}
.rain{background:linear-gradient(#e9f6ff,#fff0f7)}
.feedback.good{color:var(--leaf)}
.badge{background:#fff3c4;color:#8a5a00}
.toggle button{white-space:nowrap}
.brand small{display:block;max-width:190px}
/* story */
.story{display:flex;gap:10px;align-items:center;background:#fff;border-radius:20px;padding:10px 12px;margin-bottom:12px;box-shadow:0 4px 14px rgba(255,95,162,.15);border:3px dashed var(--lv)}
.story .tina{flex:0 0 72px;width:72px;height:72px;border-radius:50%;object-fit:cover;border:4px solid var(--lv);box-shadow:0 3px 8px rgba(0,0,0,.15)}
.story .chap{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--lv)}
.story p{margin:2px 0 0;font-size:14px;line-height:1.4}
.tina .arm{transform-box:fill-box;transform-origin:10% 10%;animation:wave 1.6s ease-in-out infinite}
@keyframes wave{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-18deg)}85%{transform:rotate(8deg)}}

/* ===== green theme (v2) ===== */
:root{ --green:#2fbf71; --green-d:#1f9a58; --green-soft:#e3f7ea; --rose:#ff4f9a; --sun:#ffc52e; --orange:#ff8a2a; --blue:#2f80ed; --navy:#1b2f7a;
  --accent:#ff4f9a; --accent-soft:#ffe1ef; --line:#dcefe3; }
html,body{background:linear-gradient(180deg,#c9f2d9 0%,#e8fbef 25%,#fffbe6 70%,#fff1dc 100%) fixed}
body::before{background-image:radial-gradient(circle at 8% 12%,#ffc52e 0 5px,transparent 6px),radial-gradient(circle at 92% 18%,#ff4f9a 0 6px,transparent 7px),radial-gradient(circle at 85% 70%,#ff8a2a 0 5px,transparent 6px),radial-gradient(circle at 12% 80%,#2fbf71 0 6px,transparent 7px),radial-gradient(circle at 50% 95%,#ffc52e 0 4px,transparent 5px)}
.brand h1 span:nth-child(odd){color:var(--blue)!important}
.brand h1 span:nth-child(even){color:var(--navy)!important}
.logo{background:linear-gradient(135deg,var(--green),var(--green-d));box-shadow:0 3px 0 #17824a}
.toggle button.on{background:var(--green);color:#fff}
nav.tabs button[data-t=learn].on{background:var(--green);color:#fff}
nav.tabs button[data-t=practice].on{background:var(--rose);color:#fff}
nav.tabs button[data-t=melodies].on{background:var(--sun);color:#5a3d00}
.btn{background:linear-gradient(135deg,#ff6aa9,var(--rose));box-shadow:0 3px 0 #c9306f}
.btn:active{box-shadow:0 1px 0 #c9306f}
.btn.ghost{background:var(--green-soft);color:#14623a;box-shadow:0 3px 0 #bfe8cf}
.seg button.on{background:var(--green);color:#fff}
.tip{background:#fff7d6;border-left-color:var(--orange)}
.teacher{background:linear-gradient(120deg,#e3f7ea,#fff4d4)}
.rain{background:linear-gradient(#ecfbf2,#fff6e3)}
.stat:nth-child(1) b{color:var(--green)}.stat:nth-child(2) b{color:var(--rose)}.stat:nth-child(3) b{color:var(--orange)}
.grp{color:var(--green-d)}
.emo{background:linear-gradient(135deg,#e3f7ea,#fff1d6)}
.story{box-shadow:0 4px 14px rgba(47,191,113,.18)}
.choice.good{background:var(--green)!important}
.feedback.good{color:var(--green-d)}
.pay .price{color:var(--rose)}
.pay .duo img{border-color:var(--rose)}

/* ===== Van Gogh & Tina studio theme (v3) ===== */
:root{ --plum:#4f2149; --plum-2:#6b2f63; --pink:#f9c6d6; --pink-l:#fde3ec; --cream:#fff6ec; --cobalt:#2b5fd9; --navy:#1b2f7a;
  --sun:#ffbe1a; --coral:#e9573f; --teal:#239c99; --wood:#d98a3d; --leafg:#5aae78;
  --ink:#3b1f38; --muted:#7a5f74; --accent:#e9573f; --accent-soft:#fde3ec; --line:#f1d4de; }
html,body{background:linear-gradient(180deg,#fde3ec 0%,#f9c6d6 45%,#f7cfc8 75%,#f2d3a6 100%) fixed;color:var(--ink)}
body,button,input{font-family:'Poppins',Nunito,system-ui,sans-serif}
body::before{opacity:.5;background-image:radial-gradient(circle at 8% 12%,#ffbe1a 0 5px,transparent 6px),radial-gradient(circle at 92% 18%,#2b5fd9 0 6px,transparent 7px),radial-gradient(circle at 85% 70%,#e9573f 0 5px,transparent 6px),radial-gradient(circle at 12% 80%,#239c99 0 6px,transparent 7px),radial-gradient(circle at 50% 95%,#ffbe1a 0 4px,transparent 5px)}
.brand h1,h2,.lvlhead b,.pay h2{font-family:'Poppins',sans-serif;font-weight:800;color:var(--plum)}
.brand h1 span:nth-child(odd){color:var(--cobalt)!important}
.brand h1 span:nth-child(even){color:var(--navy)!important}
.brand small{color:var(--plum-2)}
.logo{background:var(--plum);box-shadow:0 3px 0 #2e1029}
.toggle{background:var(--cream)}
.toggle button.on{background:var(--plum);color:#fff}
nav.tabs{background:var(--cream);box-shadow:0 2px 0 #eecbd6}
nav.tabs button{color:var(--plum-2)}
nav.tabs button[data-t=learn].on{background:var(--cobalt);color:#fff}
nav.tabs button[data-t=practice].on{background:var(--coral);color:#fff}
nav.tabs button[data-t=melodies].on{background:var(--sun);color:var(--plum)}
.card{background:var(--cream);box-shadow:0 6px 18px rgba(79,33,73,.12)}
.staffbox,.stat,.seg button,.choice,.valrow,.melvals button,.mel{background-color:#fff}
.lvlnum{color:#fff}
.lvlhead small{color:var(--plum-2)}
.step{color:var(--plum-2)}
.btn{background:var(--plum);box-shadow:0 3px 0 #2e1029;color:#fff}
.btn:active{box-shadow:0 1px 0 #2e1029}
.btn.ghost{background:#fff;color:var(--plum);box-shadow:0 3px 0 #ebcad7}
.seg button.on{background:var(--cobalt);color:#fff}
.tip{background:#fff;border-left:5px solid var(--sun);color:var(--ink)}
.teacher{background:var(--pink-l)}
.bubble{color:var(--plum);font-weight:600}
.story{background:#fff;border:3px solid var(--plum);box-shadow:0 6px 16px rgba(79,33,73,.15)}
.story .chap{color:var(--coral)}
.story p{color:var(--plum);font-weight:600}
.rain{background:linear-gradient(#fde3ec,#fff6ec)}
.stat:nth-child(1) b{color:var(--teal)}.stat:nth-child(2) b{color:var(--coral)}.stat:nth-child(3) b{color:var(--cobalt)}
.grp{color:var(--coral)}
.mel b{color:var(--plum)}
.emo{background:var(--pink-l)}
.badge{background:var(--sun);color:var(--plum)}
.choice.good{background:var(--teal)!important;color:#fff}.choice.bad{background:var(--coral)!important;color:#fff}
.feedback.good{color:var(--teal)}.feedback.bad{color:var(--coral)}
.valcnt{color:var(--coral)}
.pay .price{color:var(--coral)}
.pay .duo img{border-color:var(--sun)}
.pay h2{color:var(--plum)}

/* ===== touches of green, like the studio window (v3b) ===== */
:root{ --leafg:#5aae78; --leafd:#3f8f5e; --leafl:#e4f3e8; }
.step{color:var(--leafd)}
.tip{border-left-color:var(--leafg)}
.teacher{border:2px solid var(--leafg)}
.grp{color:var(--leafd)}
.stat:nth-child(1) b{color:var(--leafg)}
.choice.good{background:var(--leafg)!important}
.feedback.good{color:var(--leafd)}
.seg button.on{background:var(--leafg)}
.story .chap{color:var(--leafd)}
.btn.ghost{box-shadow:0 3px 0 #bfe0c9;color:var(--leafd)}
.badge{background:var(--leafl);color:var(--leafd)}
nav.tabs{box-shadow:0 2px 0 #cfe6d6}
.emo{background:var(--leafl)}
.lvlhead small{color:var(--leafd)}

/* ===== stronger green (v3c) ===== */
:root{ --leafg:#4caf6e; --leafd:#2f8a50; }
nav.tabs button[data-t=learn].on{background:var(--leafg)!important;color:#fff}
.lvlnum{background:var(--leafg)!important}
.card{border-top-color:var(--leafg)!important}
.story{border-color:var(--leafg)!important;border-width:4px}
.story .tina{border-color:var(--leafg)!important}
.teacher{border:3px solid var(--leafg);background:#eaf6ee}
.seg button.on{background:var(--leafg)!important}
.btn.ghost{background:#eaf6ee!important;color:var(--leafd)!important;box-shadow:0 3px 0 #a8d8b8!important}
.toggle button.on{background:var(--leafg)!important}
.speedrow span{color:var(--leafd)}
html,body{background:linear-gradient(180deg,#fde3ec 0%,#f9c6d6 40%,#f7cfc8 68%,#d9ecc9 88%,#b9dfa6 100%) fixed}

/* ===== Solfa title in rose, yellow logo (v3d) ===== */
header .brand h1 span:nth-child(n){color:#ff4f9a!important}
.brand h1{text-shadow:0 2px 0 #fff}
.logo{background:#ffbe1a!important;color:var(--plum)!important;box-shadow:0 3px 0 #d99a00!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">𝄞</div>
      <div><h1><span>S</span><span>o</span><span>l</span><span>f</span><span>a</span></h1><small id="tagline"></small></div>
    </div>
    <div class="toggles">
      <div class="toggle" id="langToggle"><button data-l="en">EN</button><button data-l="vi">VI</button></div>
      <div class="toggle" id="namingToggle"><button data-n="letter">C D E</button><button data-n="solfege">Do Re Mi</button></div>
    </div>
  </header>

  <div class="levels" id="levels"></div>
  <div class="lvlhead"><div class="lvlnum" id="lvNum">1</div><div><b id="lvTitle"></b><small id="lvSub"></small></div></div>

  <nav class="tabs" id="tabs">
    <button data-t="learn"></button><button data-t="practice"></button><button data-t="melodies"></button>
  </nav>

  <section id="learn">
    <div class="story" id="story"></div>
    <div class="card" id="lessonCard"></div>
    <div class="spread">
      <button class="btn ghost" id="prevL"></button>
      <div class="dots" id="lessonDots"></div>
      <button class="btn" id="nextL"></button>
    </div>
  </section>

  <section id="practice" class="hidden">
    <div class="seg" id="modeSeg"></div>
    <div class="stats">
      <div class="stat"><b id="sScore">0/0</b><small id="lCorrect"></small></div>
      <div class="stat"><b id="sStreak">0</b><small id="lStreak"></small></div>
      <div class="stat"><b id="sBest">0</b><small id="lBest"></small></div>
    </div>
    <div class="card">
      <p class="prompt" id="qPrompt"></p>
      <div class="staffbox" id="qStaff"></div>
      <div class="row" id="qAudio" style="justify-content:center;margin:6px 0">
        <button class="btn small" id="qPlay"></button>
        <button class="btn ghost small" id="qRef"></button>
      </div>
      <div class="feedback" id="qFeedback"></div>
      <div class="choices" id="qChoices"></div>
      <div class="piano" id="qPiano"></div>
      <div class="row" style="justify-content:space-between;margin-top:10px">
        <div class="row">
          <label class="chk" id="namesWrap"><input type="checkbox" id="showNames" checked> <span id="lNames"></span></label>
          <label class="chk" id="easyWrap"><input type="checkbox" id="easy" checked> <span id="lEasy"></span></label>
        </div>
        <button class="btn ghost small" id="resetStats"></button>
      </div>
    </div>
  </section>

  <section id="paywall" class="hidden"><div class="card pay" id="payCard"></div></section>

  <section id="melodies" class="hidden">
    <div class="card" id="melList">
      <p style="margin-top:0;color:var(--muted);font-size:14px" id="melIntro"></p>
      <div id="melItems"></div>
    </div>
    <div class="card hidden" id="melPlayer">
      <div class="spread">
        <button class="btn ghost small" id="melBack"></button>
        <span class="badge" id="melBadge"></span>
      </div>
      <h2 id="melTitle" style="margin-top:12px"></h2>
      <p id="melInfo" style="color:var(--muted);font-size:14px;margin-top:0"></p>
      <div class="melvals" id="melVals"></div>
      <div class="staffbox" id="melStaff"></div>
      <div class="speedrow"><span id="lSpeed"></span><div class="seg speed" id="speedSeg"></div></div>
      <div class="row" style="margin:6px 0 4px">
        <button class="btn small" id="melListen"></button>
        <button class="btn ghost small" id="melPlayAlong"></button>
        <button class="btn ghost small" id="melInTime"></button>
      </div>
      <div class="feedback" id="melFeedback"></div>
      <div class="kbwrap" id="kbwrap"><div class="kbinner" id="kbinner">
      <div class="rain" id="rain"></div>
      <div class="piano" id="mPiano" style="margin-top:0"></div>
      </div></div>
      <div class="row" style="margin-top:10px;gap:14px">
        <label class="chk"><input type="checkbox" id="showRain" checked> <span id="lRain"></span></label>
        <label class="chk"><input type="checkbox" id="showCounts"> <span id="lCounts"></span></label>
        <label class="chk"><input type="checkbox" id="melHint" checked> <span id="lHint"></span></label>
      </div>
    </div>
  </section>
</div>

  if(!actx){ const A=window.AudioContext||window.webkitAudioContext; if(!A) return null; actx=new A();
    master=actx.createDynamicsCompressor(); master.threshold.value=-14; master.ratio.value=4; master.connect(actx.destination);
    loadPiano(); }
  if(actx.state==='suspended') actx.resume();
  return actx;
}
function loadPiano(){
  if(pianoLoading) return; pianoLoading=true;
  Object.entries(PIANO_B64).forEach(([m,b64])=>{
    try{
      const bin=atob(b64), buf=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) buf[i]=bin.charCodeAt(i);
      const done=ab=>{ const d=ab.getChannelData(0); let pk=0.01; for(let i=0;i<d.length;i+=4) pk=Math.max(pk,Math.abs(d[i])); ab._peak=pk; PIANO[m]=ab; }, fail=()=>{};

    }catch(e){}

}
function synthNote(c,m,t,dur,vol){
  const f=440*Math.pow(2,(m-69)/12), out=c.createGain();
  out.gain.setValueAtTime(0.0001,t); out.gain.exponentialRampToValueAtTime(vol,t+0.012);
  out.gain.exponentialRampToValueAtTime(vol*0.38,t+0.25); out.gain.exponentialRampToValueAtTime(0.0001,t+dur+0.5);
  out.connect(master);
  [[1,1],[2,.45],[3,.18],[4,.09]].forEach(([h,a])=>{ const o=c.createOscillator(),g=c.createGain(); o.type='sine'; o.frequency.value=f*h; g.gain.value=a; o.connect(g); g.connect(out); o.start(t); o.stop(t+dur+0.6); });
}
function playMidi(m, when=0, dur=0.8, vol=0.3){
  const c=ac(); if(!c) return;
  const t=c.currentTime+when;
  const keys=Object.keys(PIANO).map(Number);
  if(!keys.length){ synthNote(c,m,t,dur,vol); return; }
  let best=keys[0]; keys.forEach(k=>{ if(Math.abs(k-m)<Math.abs(best-m)) best=k; });
  const src=c.createBufferSource(); src.buffer=PIANO[best]; src.playbackRate.value=Math.pow(2,(m-best)/12);
  const g=c.createGain(); const level=(vol/0.3)*0.8/(PIANO[best]._peak||0.3), end=t+Math.max(dur,0.35)+0.15;
  g.gain.setValueAtTime(level,t); g.gain.setValueAtTime(level,end); g.gain.exponentialRampToValueAtTime(0.0001,end+0.45);
  src.connect(g); g.connect(master); src.start(t); src.stop(end+0.5);
}

  const left = headerWidth(opts), step = opts.step || 36;
  items.forEach((it,i)=>{ if(it.x===undefined) it.x = left + i*step + step/2; });
  const lastX = items.length ? Math.max(...items.map(i=>i.x)) : left;
  const width = opts.width || Math.max(200, lastX + step/2 + 12);
  let s = `<svg viewBox="0 0 ${width} ${G.h}" ${opts.fit?'width="100%"':`width="${width*1.1}" height="${G.h*1.1}"`} xmlns="http://www.w3.org/2000/svg">`;
  G.staves.forEach(st=>{
    for(let i=0;i<5;i++) s+=`<line x1="8" x2="${width-6}" y1="${st.top+i*SP}" y2="${st.top+i*SP}" stroke="#23212b" stroke-width="1"/>`;
    if(st.clef==='treble') s+=glyph('treble',11,yIn(st,32)+1,50,'#23212b');
    else s+=glyph('bass',8,st.top+5+757*0.054,54,'#23212b');
    const K=KEYSIGS[opts.keysig||'C'], off = st.clef==='treble'?0:-14; let kx=50;
    K.s.forEach(stp=>{ const d={3:38,0:35}[stp]+off; s+=accGlyph(kx,yIn(st,d),1,'#23212b'); kx+=9; });
    K.f.forEach(stp=>{ const d={6:34,2:37}[stp]+off; s+=accGlyph(kx,yIn(st,d),-1,'#23212b'); kx+=9; });
    if(opts.time){ const tx_=kx+6; s+=`<text x="${tx_}" y="${st.top+19}" text-anchor="middle" font-size="21" font-weight="800" font-family="Georgia,serif" fill="#23212b">${opts.time[0]}</text><text x="${tx_}" y="${st.top+39}" text-anchor="middle" font-size="21" font-weight="800" font-family="Georgia,serif" fill="#23212b">${opts.time[1]}</text>`; }
  });
  const top=G.staves[0].top, bot=botY(G.staves[G.staves.length-1]);
  if(G.staves.length>1) s+=`<line x1="8" x2="8" y1="${top}" y2="${bot}" stroke="#23212b" stroke-width="1.2"/><path d="M6 ${top} q-6 ${(bot-top)/4} 0 ${(bot-top)/2} q-6 ${(bot-top)/4} 0 ${(bot-top)/2}" stroke="#23212b" stroke-width="2.4" fill="none"/>`;
  (opts.bars||[]).forEach(bx=> G.staves.forEach(st=> s+=`<line x1="${bx}" x2="${bx}" y1="${st.top}" y2="${botY(st)}" stroke="#23212b" stroke-width="1"/>`));
  if(opts.end) G.staves.forEach(st=> s+=`<line x1="${width-11}" x2="${width-11}" y1="${st.top}" y2="${botY(st)}" stroke="#23212b" stroke-width="1"/><line x1="${width-7.5}" x2="${width-7.5}" y1="${st.top}" y2="${botY(st)}" stroke="#23212b" stroke-width="3"/>`);
  items.forEach(it=> s+=itemSVG(G,it));
  return s+'</svg>';
}

function makePiano(el, lo, hi, opts={}, onPress){
  el.innerHTML=''; el.dataset.range=lo+'-'+hi;
  const whites=[]; for(let m=lo;m<=hi;m++) if(!isBlack(m)) whites.push(m);
  const n=whites.length; el.classList.toggle('dense', n>9);
  el.classList.toggle('nolabels', opts.labels===false);
  const marks = opts.marks||[];
  whites.forEach(m=>{
    const k=document.createElement('div'); const s=spell(m);
    k.className='wk'+(m===60?' mid':'')+(marks.includes(m)?' hint':''); k.dataset.m=m;
    const sub = m===60 ? tx('middle','giữa') : '';
    k.innerHTML=`<span>${nm(s.d)}<b>${sub || (n>9 && mod(m,12)===0 ? Math.floor(m/12)-1 : '')}</b></span>`;
    k.addEventListener('pointerdown',e=>{ e.preventDefault(); press(k); playMidi(m); onPress&&onPress(m); });
    el.appendChild(k);
  });
  const bw = 60/n;
  for(let m=lo;m<=hi;m++) if(isBlack(m)){
    const wi = whites.findIndex(w=>w===m-1); if(wi<0) continue;
    const b=document.createElement('div'); b.className='bk'+(marks.includes(m)?' hint':''); b.dataset.m=m;
    b.style.left=`${(wi+1)/n*100 - bw/2}%`; b.style.width=bw+'%';
    if(opts.blackNames) b.innerHTML=`<span>${mName(m,!!opts.flat)}</span>`;
    b.addEventListener('pointerdown',e=>{ e.preventDefault(); press(b); playMidi(m); onPress&&onPress(opts.black?m:null); });
    el.appendChild(b);
  }
}

function parseMel(str){
  return str.trim().split(/\s+/).map(t=>{
    const [n,b]=t.split(':'); const beats=b?parseFloat(b):1;
    if(n==='r') return {rest:true,beats};
    const parts=n.split('+').map(x=>{ const mm=x.match(/^([A-G])([#b]?)(\d)$/); const d=Number(mm[3])*7+LET.indexOf(mm[1]), acc=mm[2]==='#'?1:mm[2]==='b'?-1:0; return {d,acc,m:midi(d,acc)}; });
    const top=parts[parts.length-1];
    return {d:top.d,acc:top.acc,m:top.m,beats,ms:parts.map(x=>x.m),ds:parts};
  });
}

function playCounted(beats, m=67){

on the same line or space.": "voice/d967d170eb.mp3", "Naturals and the bar rule": "voice/2bbc518c41.mp3", "A natural cancels a sharp or flat. An accidental lasts until the end of the bar, then it's gone.": "voice/cba22edf6c.mp3", "Half and whole steps": "voice/f7e111b690.mp3", "Half step = the very next key, black or white. Whole step = two half steps.": "voice/8be881a26d.mp3", "E–F and B–C are half steps with no black key in between.": "voice/0c00bd270e.mp3", "Beat and bar": "voice/b0273d75b7.mp3", "Music has a steady beat, like a heartbeat. Beats are grouped into bars, separated by bar lines.": "voice/f87004613d.mp3", "The time signature 4/4 means 4 beats in every bar. 3/4 is the waltz: 1 to 2-3, 1 to 2-3.": "voice/d5949b85d6.mp3", "Dotted notes": "voice/eb9a1bfa7c.mp3", "A dot adds half the note's value. Dotted half = 2 + 1 = 3 beats. Dotted quarter = 1 + a half = one and a half beats.": "voice/033baaf0ca.mp3", "Rests = silence": "voice/a8fa3d725c.mp3", "A rest is a silence with a length. Each note value has its own rest, lasting exactly as long as its note.": "voice/98f9299531.mp3", "Whole rest, 4 counts": "voice/7efd5a28de.mp3", "Half rest, 2 counts": "voice/3628d63224.mp3", "Quarter rest, 1 count": "voice/88bb97ffa8.mp3", "Eighth rest, a half count": "voice/d31291c3b2.mp3", "Whole rest hangs below a line, like a hat taken off. Half rest sits on a line, like a hat on your head.": "voice/24242ca3f0.mp3", "Counting eighths": "voice/8da828d23d.mp3", "Eighth notes split the beat in two. Count them out loud: 1 and 2 and 3 and 4 and .": "voice/7a01889aa6.mp3", "What is an interval?": "voice/1936c0980a.mp3", "An interval is the distance between two notes. Count the note names, including both ends: C , E = C, D, E = a 3rd.": "voice/a7c0b01179.mp3", "From 2nd to octave": "voice/9896e3a18f.mp3", "Starting from C, each white key up makes the interval one bigger. Tap to hear each one:": "voice/df77fff709.mp3", "Line or space?": "voice/913f43cfb1.mp3", "3rd, 5th, 7th: both notes on lines, or both in spaces. 2nd, 4th, 6th, octave: one on a line, one in a space.": "voice/df7ba073fa.mp3", "Songs to remember": "voice/22f974356d.mp3", "Link each interval to a tune you know:": "voice/a64d0c2d70.mp3", "• 4th: Here Comes the Bride (Wagner) • 5th: Twinkle Twinkle • Octave: the first two notes of Somewhere Over the Rainbow": "voice/7b2dd7337d.mp3", "The major scale recipe": "voice/7dc54d3e41.mp3", "Every major scale follows the same steps: whole, whole, half, whole, whole, whole, half. Starting on C, this uses only white keys.": "voice/14005ab751.mp3", "G major and F sharp": "voice/b3dbc2f2fd.mp3", "Start the recipe on G and you need F sharp instead of F. Instead of writing sharp every time, we write it once at the start of each line: the key signature.": "voice/eb306d7b98.mp3", "F major and B flat": "voice/300f739216.mp3", "Start on F: you need B flat. Key signature: one flat.": "voice/b871024fb5.mp3", "Two sharps, two flats": "voice/f6d865b401.mp3", "D major: F sharp and C sharp. B flat major: B flat and E flat.": "voice/21b1faf0dc.mp3", "Sharps: go up a half step from the last sharp to find the key. Flats: the second-to-last flat names the key.": "voice/3a9b2baafb.mp3", "The triad": "voice/d11dbb5474.mp3", "A chord is several notes played together. The basic chord is the triad: three notes stacked in 3rds (root, 3rd, 5th). C major = C, E, G.": "voice/28e99aaaaf.mp3", "Major vs minor": "voice/408c89c53b.mp3", "Major chords sound bright. Lower the middle note by a half step and you get a minor chord, softer and sadder: C, E flat, G.": "voice/c61c77a77d.mp3", "Chords of C major": "voice/76aa1d6902.mp3", "Build a triad on each white note, using only white keys:": "voice/7c4a79adb7.mp3", "The magic three": "voice/9c613dbb13.mp3", "C major, F major and G major (called I, IV, V) can accompany thousands of songs.": "voice/c53f2dc300.mp3", "Try humming Twinkle Twinkle over these chords.": "voice/008e722556.mp3", "The natural minor scale": "voice/0769ca8b55.mp3", "Play the white keys from A to A: that's A minor. Steps: whole, half, whole, whole, half, whole, whole. It sounds darker than major.": "voice/76242459d5.mp3", "Relative keys": "voice/c41ce3b4a5.mp3", "Every major key has a relative minor with the same key signature. It starts 3 half steps lower: C major , A minor, G major , E minor, F major , D minor.": "voice/8f1abd4ccc.mp3", "Harmonic minor": "voice/80675e5047.mp3", "Raise the 7th note by a half step (G , G sharp in A minor) and you get the harmonic minor, with its exotic, Eastern sound.": "voice/891230bf71.mp3", "Final challenge": "voice/588cf7e662.mp3", "In Practice, the Final mix asks questions from every level: reading in both clefs, sharps and flats, rhythm, intervals, key signatures and chords.": "voice/669cc7f58e.mp3", "Get 10 in a row to complete the course!": "voice/519e4ea402.mp3", "Well done! Now you try it on the piano.": "voice/18f965f74a.mp3", "Which note is this? Tap it on the piano.": "voice/6b6f0f6e3a.mp3", "Listen, then find the note on the piano.": "voice/2f5749ce22.mp3", "Two notes at once! Tap both keys: left hand + right hand.": "voice/5b494886b1.mp3", "How many beats does this note last?": "voice/75dc9acddc.mp3", "How many beats of silence?": "voice/c9a20ed879.mp3", "Listen: which rhythm did you hear?": "voice/a83a0d5b7b.mp3", "Which interval is this?": "voice/3220618fd7.mp3", "Listen: how far apart are the two notes?": "voice/8711275cbc.mp3", "Which major key has this key signature?": "voice/b4d0b98008.mp3", "Name this chord.": "voice/baa53b2662.mp3", "Listen: major or minor chord?": "voice/75e1e78d1b.mp3", "Which minor key shares this key signature?": "voice/65c3341cec.mp3"};
const clipCache=new Map(); let currentClip=null;
function loadClip(url){
  if(clipCache.has(url)) return clipCache.get(url);
  const pr=fetch(url).then(r=>{ if(!r.ok) throw 0; return r.arrayBuffer(); }).then(ab=>new Promise((res,rej)=>{ const q=ac().decodeAudioData(ab,res,rej); if(q&&q.then) q.then(res,rej); }));
  pr.catch(()=>clipCache.delete(url)); clipCache.set(url,pr); return pr;
}
const clipFor = text => (S.lang==='en' && VOICE_MAP[text]) || null;
async function playClip(url){
  const buf=await loadClip(url), c=ac();
  return new Promise(res=>{ const src=c.createBufferSource(); src.buffer=buf; const g=c.createGain(); g.gain.value=1.15; src.connect(g); g.connect(master); currentClip=src; src.onended=()=>{ if(currentClip===src) currentClip=null; res(); }; src.start(); });
}
async function speak(text){
  const url=clipFor(text);
  if(url){ try{ await playClip(url); return; }catch(e){} }
  return speakTTS(text);
}
function speakTTS(text){
  return new Promise(res=>{
    const words=text.split(' ').length, fallback=Math.max(1400, words*420);
    let done=false; const fin=()=>{ if(!done){ done=true; res(); } };
    try{
      if(!window.speechSynthesis || canSpeak===false) throw 0;
      try{ speechSynthesis.resume(); }catch(e){}
      const u=new SpeechSynthesisUtterance(text); u.lang=S.lang==='vi'?'vi-VN':'en-GB'; const v=pickVoice(); if(v) u.voice=v;
      u.rate=0.88; u.pitch=1.1; u.onend=fin; u.onerror=fin; speechSynthesis.speak(u);
      setTimeout(fin, words*650+2500);
    }catch(e){ setTimeout(fin, fallback); }
  });
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function playDuration(b){
  if(b.dataset.play){ const toks=b.dataset.play.trim().split(/\s+/); const gap=b.dataset.play.includes('+')?0.9:0.45; return (toks.length*gap+1.2)*1000; }
  const beats=(b.dataset.count||b.dataset.rhythm||'').split(' ').map(Number).reduce((a,c)=>a+Math.abs(c),0);
  return (beats*0.5/(S.speed||0.6)*0.85+1)*1000;
}
function teacherSteps(card){
  const out=[];
  card.querySelectorAll('h2, p, .tip, .valrow, .row, .treerow').forEach(el=>{
    if(el.closest('.teacher')) return;
    if(el.matches('.row')){ const b=el.querySelector('[data-play],[data-count],[data-rhythm]'); if(b) out.push({type:'play',el:b}); return; }
    if(el.matches('.treerow')){ const b=el.querySelector('[data-count]'); if(b) out.push({type:'play',el:b,hl:el}); return; }
    if(el.matches('.valrow')){ out.push({type:'say',el,text:el.querySelector('.valtxt b').innerText+', '+el.querySelector('.valcnt').innerText}); out.push({type:'play',el}); return; }
    if(el.closest('.valrow')) return;
    const t=el.innerText.trim(); if(t) out.push({type:'say',el,text:t});
  });
  return out;
}
function stopLesson(){
  const r=lessonRun; lessonRun=null;
  try{ if(currentClip){ currentClip.onended=null; currentClip.stop(); currentClip=null; } }catch(e){}
  try{ speechSynthesis.cancel(); }catch(e){}
  document.querySelectorAll('.reading').forEach(e=>e.classList.remove('reading'));
  const owl=document.querySelector('#lessonCard .owl'); if(owl) owl.classList.remove('talking');
  if(r && r.btn){ r.btn.textContent=tx('▶ Teach me','▶ Dạy em nhé'); }
}
async function runLesson(){
  const card=$('lessonCard'), btn=card.querySelector('.tbtn'), bub=card.querySelector('.bubble'), owl=card.querySelector('.owl');
  if(lessonRun){ stopLesson(); return; }
  const run={btn}; lessonRun=run; btn.textContent=tx('■ Stop','■ Dừng');
  ac();
  // iOS needs the first utterance inside the tap: say a tiny warm-up right away
  try{ if(window.speechSynthesis){ speechSynthesis.cancel(); const w=new SpeechSynthesisUtterance(' '); w.volume=0; speechSynthesis.speak(w); } }catch(e){}
  const steps0=teacherSteps(card);
  const recorded = steps0.filter(st=>st.type==='say').every(st=>clipFor(cleanSpeech(st.text)));
  steps0.filter(st=>st.type==='say').slice(0,2).forEach(st=>{ const u=clipFor(cleanSpeech(st.text)); if(u) loadClip(u).catch(()=>{}); });
  if(!recorded && canSpeak===null) canSpeak = await voicesReady();
  if(!recorded && !canSpeak){
    bub.innerHTML=tx('🔇 This app view can\'t read aloud. I\'ll show the lesson as subtitles. <small>Tip: open Solfa in <b>Chrome</b> or <b>Safari</b> to hear my voice.</small>','🔇 Màn hình này không đọc to được. Thầy sẽ hiện phụ đề. <small>Mẹo: mở Solfa bằng <b>Chrome</b> hoặc <b>Safari</b> để nghe giọng thầy.</small>');
    await sleep(3500); if(lessonRun!==run) return;
  }
  const steps=steps0;
  for(let si=0; si<steps.length; si++){ const st=steps[si];
    if(lessonRun!==run) return;
    const nx=steps.slice(si+1).find(x=>x.type==='say'); if(nx){ const u=clipFor(cleanSpeech(nx.text)); if(u) loadClip(u).catch(()=>{}); }
    document.querySelectorAll('.reading').forEach(e=>e.classList.remove('reading'));
    const hl=st.hl||st.el; hl.classList.add('reading'); hl.scrollIntoView({block:'center',behavior:'smooth'});
    if(st.type==='say'){ const txt=cleanSpeech(st.text); bub.textContent=st.text.replace(/▶/g,'').trim(); owl.classList.add('talking'); await speak(txt); owl.classList.remove('talking'); await sleep(250); }
    else { bub.textContent=tx('🎵 Listen…','🎵 Nghe nhé…'); st.el.click(); await sleep(playDuration(st.el)); }
  }
  if(lessonRun!==run) return;
  document.querySelectorAll('.reading').forEach(e=>e.classList.remove('reading'));
  const bye=tx('Well done! Now you try it on the piano. 🎹','Giỏi lắm! Giờ em thử trên đàn nhé. 🎹');
  bub.textContent=bye; owl.classList.add('talking'); await speak(cleanSpeech(bye)); owl.classList.remove('talking');
  card.scrollIntoView({block:'start',behavior:'smooth'}); stopLesson();
}
function speakPrompt(){ try{ speechSynthesis.cancel(); }catch(e){} try{ if(currentClip){ currentClip.onended=null; currentClip.stop(); currentClip=null; } }catch(e){} ac(); speak(cleanSpeech($('qPrompt').firstChild.textContent)); }

  const el=$('story'); if(!el) return;

// ================= helpers for lessons =================
const pbtn = (label,tokens,ghost)=>`<button class="btn small ${ghost?'ghost':''}" data-play="${tokens}">▶ ${label}</button>`;
const pianoDiv = (lo,hi,marks='',black='')=>`<div class="piano" data-lo="${lo}" data-hi="${hi}" data-marks="${marks}" data-black="${black}"></div>`;
const labelled = (ds,o={}) => ds.map(d=>({d,label:nm(d),color:(o.hl||[]).includes(d)?'#d9572b':undefined}));
const scaleTok = ds => ds.map(d=>midi(d)).join(' ');
const range = (a,b)=>{ const r=[]; for(let i=a;i<=b;i++) r.push(i); return r; };

// ================= question generators =================
function readGen(poolFn, clef, keys){
  return ()=>{ const n=poolFn(); const m=midi(n.d,n.acc||0);
    return { prompt:['Which note is this? Tap it on the piano.','Đây là nốt gì? Bấm nốt đó trên đàn.'],
      staff:{items:[{d:n.d,showAcc:n.show,beats:1}],opts:{clef,keysig:n.keysig,width:clef==='grand'?240:220,step:110}},
      input:'keys', keys, answer:m, answerLabel:()=>nm(n.d,n.acc||0), play:null };
  };
}
function hearGen(all, easyPool, keys){
  return (easy)=>{ const pool=easy?easyPool:all; const m=rnd(pool);
    return { prompt:['Listen, then find the note on the piano.','Nghe, rồi tìm nốt đó trên đàn.'],
      input:'keys', keys, answer:m, answerLabel:()=>mName(m), play:()=>playMidi(m), autoplay:true, ref:keys[0]%12===0?keys[0]:60 };
  };
}
function choiceQ(prompt, staff, choices, answer, play, autoplay, wide){ return {prompt, staff, input:'choice', choices, answer, answerLabel:()=>choices.find(c=>c.id===answer).label, play, autoplay, wide}; }

const INTV = ()=>[tx('2nd','Quãng 2'),tx('3rd','Quãng 3'),tx('4th','Quãng 4'),tx('5th','Quãng 5'),tx('6th','Quãng 6'),tx('7th','Quãng 7'),tx('Octave','Quãng 8')];
const genInterval = (hear)=> (easy)=>{
  const sizes = easy ? [2,4,7] : [1,2,3,4,5,6,7];
  const size = rnd(sizes), base = rnd(range(28, 35-Math.min(size,7)+ (size===7?0:0)).filter(d=>d+size<=37));
  const top = base+size, mb=midi(base), mt=midi(top);
  const choices = sizes.map(sz=>({id:sz,label:INTV()[sz-1]}));
  return choiceQ(hear?['Listen: how far apart are the two notes?','Nghe: hai nốt cách nhau bao xa?']:['Which interval is this?','Đây là quãng mấy?'],
    hear?null:{items:[{d:base,beats:1},{d:top,beats:1}],opts:{width:240,step:70}},
    choices, size, ()=>{ playMidi(mb,0,0.6); playMidi(mt,0.65,0.8); }, hear);
};
const VALS = [[4,'4'],[3,'3'],[2,'2'],[1.5,'1½'],[1,'1'],[0.5,'½']];
const genValue = ()=>{
  const isRest = Math.random()<0.35;
  const b = isRest ? rnd([4,2,1,0.5]) : rnd([4,3,2,1.5,1,0.5]);
  return choiceQ(isRest?['How many beats of silence?','Dấu lặng này dài mấy phách?']:['How many beats does this note last?','Nốt này ngân mấy phách?'],
    {items:[isRest?{rest:true,beats:b}:{d:32,beats:b}],opts:{width:200,step:100}},
    VALS.map(([v,l])=>({id:v,label:l})), b, isRest?null:()=>playMidi(67,0,b*0.5));
};
const PATTERNS = [[1,1,1,1],[2,2],[2,1,1],[1,1,2],[4],[0.5,0.5,1,2],[1.5,0.5,2],[3,1],[1,-1,1,1],[2,-2],[0.5,0.5,0.5,0.5,2],[1,0.5,0.5,2]];
function patternSVG(p){ return staffSVG(p.map(b=>b<0?{rest:true,beats:-b}:{d:32,beats:b}),{fit:true,width:Math.max(150,60+p.length*30),step:30}); }
const genRhythmEar = ()=>{
  const opts = shuffle(PATTERNS).slice(0,3); const ans = rnd([0,1,2]);
  return choiceQ(['Listen: which rhythm did you hear?','Nghe: bạn nghe tiết tấu nào?'], null,
    opts.map((p,i)=>({id:i,label:String.fromCharCode(65+i),html:patternSVG(p)})), ans, ()=>playRhythm(opts[ans]), true, true);
};
const genKeySig = ()=>{

const PC={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function harmonize(mel){
  const pcs=[...new Set(mel.notes.filter(n=>!n.rest).map(n=>mod(n.m,12)))];
  let root, minor=!!mel.minor;
  if(minor) root=PC[mel.minor]; else root={C:0,G:7,D:2,F:5,Bb:10}[mel.keysig||'C'];
  const flat=['F','Bb'].includes(mel.keysig)||minor&&['D','C'].includes(mel.minor);
  const ch = minor ? [[0,[0,3,7]],[7,[7,11,2]],[5,[5,8,0]],[3,[3,7,10]]] : [[0,[0,4,7]],[7,[7,11,2]],[5,[5,9,0]],[9,[9,0,4]]];
  const chords=ch.map(([r,set])=>({r:(root+r)%12, set:set.map(x=>(root+x)%12)}));
  const meter=mel.meter||4, pk=mel.pickup||0;
  const isBass = (mel.clef||'treble')==='bass';
  // group notes by bar
  const bars=[]; let t=0;
  mel.notes.forEach((n,i)=>{ const bi = t<pk-1e-6 ? -1 : Math.floor((t-pk+1e-6)/meter); (bars[bi+1]=bars[bi+1]||[]).push({n,i}); t+=n.beats; });
  bars.forEach((bar,bk)=>{
    if(!bar) return;
    const first=bar.find(x=>!x.n.rest); if(!first || first.n.ds.length>1) return;
    const w=chords.map((c,ci)=>bar.reduce((a,{n})=>a+(n.rest?0:(c.set.includes(mod(n.m,12))?n.beats:0)),0)-ci*0.01);
    let best=w.indexOf(Math.max(...w)); if(bk===bars.length-1) best=0;
    const c=chords[best];
    let m;
    if(isBass){ const third=c.set[1]; m=60+((third-0+12)%12); if(m>71) m-=12; }      // right hand plays the chord's 3rd near middle C
    else { m=48+c.r; if(m>=60) m-=12; }                                              // left hand plays the chord root in octave 3
    const sp=spell(m, flat); const part={d:sp.d,acc:sp.acc,m};
    const n=first.n; n.ds = isBass ? [...n.ds, part] : [part, ...n.ds]; n.ms=n.ds.map(x=>x.m); n.auto=true;
  });
  mel.clef='grand';
}

function computeFingering(mel){
  const clef=melClef(mel);

  const init={R:null,L:null};

  const now=performance.now(), r=S.timed;
  let best=null; r.items.forEach(it=>{ if(it.ms.includes(m) && !it.hit.includes(m) && Math.abs(now-it.T)<=r.win && (!best || Math.abs(now-it.T)<Math.abs(now-best.T))) best=it; });
  if(best){ best.hit.push(m); r.hits++; const n=S.mel.notes[best.i], p=n.ds.find(q=>q.m===m); colorKey($('mPiano'),m,p.d,350); }
  else markKey($('mPiano'),m,'bad',250);
}
// ================= free / unlock =================
function fnv(x){ let h=0x811c9dc5; for(const b of new TextEncoder().encode(x)){ h^=b; h=Math.imul(h,0x01000193)>>>0; } return h.toString(16).padStart(8,'0'); }

    </ul>
    <div class="price">${SHOP.price}<small>${tx('one payment · all levels, forever','trả một lần · mọi cấp độ, mãi mãi')}</small></div>
    <div class="buy">${btn(SHOP.gumroad,tx('Buy on Gumroad','Mua trên Gumroad'))}${btn(SHOP.payhip,tx('Buy on Payhip','Mua trên Payhip'))}</div>

  const go=()=>{ const v=$('codeIn').value.trim().toUpperCase().replace(/\s+/g,'');
    if(SHOP.codes.includes(fnv(v))){ S.unlocked=true; save(); $('codeMsg').textContent=tx('🎉 Unlocked! Have fun!','🎉 Đã mở khóa! Chúc vui!'); $('codeMsg').style.color='var(--leaf)'; celebrate('🎹'); setTimeout(()=>{ renderLevels(); setTab(S.tab); },900); }
